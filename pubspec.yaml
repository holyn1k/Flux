name: flux
description: "Multifunctional Max client written in Dart."
publish_to: 'none'
version: 0.5.19+19

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  kolibri: ^0.1.4
  komet_crypto:
    path: native/komet_crypto
  crypto: ^3.0.7
  ffi: ^2.1.0
  logger: ^2.6.2
  device_info_plus: 12.3.0
  flutter_timezone: ^5.0.1
  timezone: ^0.11.0
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  camera: ^0.11.0
  permission_handler: ^11.3.1
  archive: ^4.0.9
  geolocator: ^13.0.0
  photo_manager: ^3.0.0
  image: ^4.3.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0+2
  path: ^1.9.1
  m3e_collection: ^0.3.7
  material_symbols_icons: ^4.2906.0
  dynamic_color: ^1.8.1
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^9.0.1
  mobile_scanner: ^7.2.0
  flutter_contacts: ^1.1.9+2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  lottie: ^3.3.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  app_links: ^7.0.0
  video_player: ^2.9.2
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^22.0.1
  flutter_inappwebview: ^6.1.5
  flutter_webrtc: ^1.5.2
  record: ^6.0.0
  opus_dart: ^3.0.0
  opus_flutter_android: ^3.0.1
  ogg_opus_player: ^0.8.0
  video_player_media_kit: ^2.0.0
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  sensors_plus: ^7.1.0
  smart_auth: ^3.2.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter_launcher_icons:
  image_path: "assets/komet_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/komet.png"
  windows:
    generate: true
    image_path: "assets/komet_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/komet_icon.png"

flutter:
  generate: true
  shaders:
    - shaders/liquid_glass.frag
  uses-material-design: true
  assets:
    - assets/komet.png
    - assets/komet_icon.png
    - assets/meteor_icon.png
    - assets/emoji_keywords.json
    - assets/lottie/
    - assets/wallpapers/patterns/
    - assets/debug/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
